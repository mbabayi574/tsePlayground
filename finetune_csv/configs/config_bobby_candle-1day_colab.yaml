#This is a custom config for finetuning kronos on TSE 1-day candle data (Google Colab Version)

data:
  # Assuming you upload the 'finetune_csv' folder to Colab's default /content/ directory
  data_path: "/content/finetune_csv/data"
  lookback_window: 448
  predict_window: 5
  max_context: 448
  clip: 7.0
  # dataset split ratio
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

training:
  # control the training epochs of tokenizer and basemodel
  tokenizer_epochs: 20
  basemodel_epochs: 15
  batch_size: 32
  log_interval: 50
  num_workers: 2 # Reduced for Colab (Colab often has 2 CPU cores)
  seed: 42
  
  tokenizer_learning_rate: 0.0002
  predictor_learning_rate: 0.000005
  
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.2
  
  # gradient accumulation steps for tokenizer training
  accumulation_steps: 1

# model path configuration
model_paths:
  # pretrained model path (These download automatically from HuggingFace)
  pretrained_tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  pretrained_predictor: "NeoQuasar/Kronos-base"
  
  # experiment name - other paths will be generated based on this
  exp_name: "TSE_bobby_kline_1day_all"
  base_path: "/content/finetuned/"
  
  # The final models will be saved here
  base_save_path: "/content/finetuned_models/"
  finetuned_tokenizer: ""
  
  tokenizer_save_name: "finetuned_tokenizer"
  basemodel_save_name: "finetuned_basemodel"

experiment:
  name: "kronos_tse_1day_finetune"
  description: "Custom finetune for Tehran Stock Exchange 1-day data"
  use_comet: false
  
  # control the training phase
  train_tokenizer: true
  train_basemodel: true
  
  # if true, skip the existing model training
  skip_existing: false

# device configuration
device:
  use_cuda: true
  device_id: 0
